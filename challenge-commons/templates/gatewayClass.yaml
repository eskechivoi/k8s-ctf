{{- if .Values.global.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.global.gateway.className | default "nginx" }}
  namespace: {{ .Values.global.gateway.namespace | default .Values.global.namespace }}
  labels:
    {{- include "challenge.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.global.gateway.controllerName | default "gateway.nginx.org/nginx-gateway-controller" }}
  description: "GatewayClass for the NGINX controller of {{ include "challenge.fullname" . }}"
{{- end }}