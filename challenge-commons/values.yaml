global:
  namespace: "ctf-challenges"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  imagePullSecrets:
    -name : ""

  nodeSelector: {}

  tolerations: []

  affinity: {}
  
  configuration:
    challenge:
      replicaCount: 1
      podAnnotations: {}
      podLabels:
        type: "ctf-challenge"
      podSecurityContext: {}
      securityContext: {}
      volumes: []
      volumeMounts: []

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
