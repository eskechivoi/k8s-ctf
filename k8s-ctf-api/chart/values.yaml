image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

selectorLabels:
  component: 'api'

installerRoleName: helm-installer-role
serviceAccountName: helm-deployer-sa
roleBindingName: helm-installer-binding

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  name: http

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http