apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Chart.Name }}-route"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cft-frontend.selectorLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.gatewayName | default "commons-gateway" }}
      namespace: {{ .Values.global.gateway.namespace | default .Values.global.namespace }}
  {{- if .Values.routes.hosts }}
  hostnames:
    {{- range .Values.routes.hosts }}
    {{- if .host }}
    - {{ .host | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.routes.paths }}
  rules:
    {{- range .Values.routes.paths }}
    {{- if and (hasKey . "path") (hasKey . "port") }}
    - matches:
        - path:
            type: {{ .pathType | default "Exact" }}
            value: {{ .path }}
      backendRefs:
        - name: {{ .serviceName | default "{{ $.Chart.Name }}-service" }}
          port: {{ .port }}
          kind: Service
          namespace: {{ $.Values.global.namespace }}
    {{- end }}
    {{- end }}
  {{- end }}