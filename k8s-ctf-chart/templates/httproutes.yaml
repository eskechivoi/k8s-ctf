apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ include "k8s-parent-chart.fullname" . }}-route"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "k8s-parent-chart.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.gatewayName | default "commons-gateway" }}
      namespace: {{ .Values.global.gateway.namespace | default .Values.global.namespace }}
  {{- if .Values.routes.hosts }}
  hostnames:
    {{- range .Values.routes.hosts }}
    {{- if .host }}
    - {{ .host | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.routes.paths }}
  rules:
    {{- range .Values.routes.paths }}
    {{- if and (hasKey . "path") (hasKey . "port") }}
    - matches:
        - path:
            type: {{ .pathType | default "Exact" }}
            value: {{ .path }}
      backendRefs:
        - name: "{{ include "k8s-parent-chart.fullname" $ }}-service"
          port: {{ .port }}
    {{- end }}
    {{- end }}
  {{- end }}