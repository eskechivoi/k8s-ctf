apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.global.networkPolicies.protectApi.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.global.networkPolicies.protectApi.apiLabels | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    {{- if .Values.global.networkPolicies.protectApi.frontendLabels }}
    {{- range .Values.global.networkPolicies.protectApi.frontendLabels }}
    - podSelector:
        matchLabels:
          {{- toYaml . | nindent 10 }}
    {{- end }}
    {{- end }}
    {{- range .Values.global.networkPolicies.protectApi.allowedCidr }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    ports:
    - protocol: TCP
      port: 8000