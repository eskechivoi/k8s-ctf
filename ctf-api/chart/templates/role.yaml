apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.installerRoleName }}
  namespace: {{ .Values.global.challengesNamespace }}
rules:
- apiGroups: ["*"]
  resources: ["deployments", "services", "secrets", "configmaps", "persistentvolumeclaims", "serviceaccounts", "httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]