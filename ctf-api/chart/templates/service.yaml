apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.global.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.global.configuration.api.service.type }}
  ports:
    - port: {{ .Values.global.configuration.api.service.port }}
      targetPort: {{ .Values.global.configuration.api.service.targetPort }}
      protocol: TCP
      name: {{ .Values.global.configuration.api.service.name }}
  selector:
    {{- include "cft-api.selectorLabels" . | nindent 4 }}
