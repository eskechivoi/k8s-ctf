enabled: false # IMPORTANT! If not, the challenge will be present in ALL deployments

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "stable-perl"

selectorLabels:
  component: 'challengeName'

serviceAccount:
  create: false
  automount: true
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  name: http

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

routes:
  className: "nginx"
  annotations: {}
  tls: []
  hosts:
    - host: localhost
  paths:
    - pathType: PathPrefix
      port: 80